<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Thadm</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        --bg: #ffffff;
        --surface: #f5f5f5;
        --border: #e2e2e2;
        --text: #111111;
        --muted: #777777;
        --accent-bg: #111111;
        --accent-fg: #ffffff;
        --green: #16a34a;
        --red: #dc2626;
        --yellow: #ca8a04;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111111;
          --surface: #1c1c1c;
          --border: #2a2a2a;
          --text: #f0f0f0;
          --muted: #888888;
          --accent-bg: #f0f0f0;
          --accent-fg: #111111;
          --green: #22c55e;
          --red: #f87171;
          --yellow: #fbbf24;
        }
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        width: 380px;
        background: var(--bg);
        color: var(--text);
        font-size: 13px;
        line-height: 1.4;
      }

      /* ── Header ── */
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 11px 14px 10px;
        border-bottom: 1px solid var(--border);
      }
      .title {
        font-weight: 600;
        font-size: 14px;
        letter-spacing: -0.01em;
      }
      #settings-btn {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--muted);
        font-size: 15px;
        padding: 3px 5px;
        border-radius: 4px;
        line-height: 1;
        transition: color 0.1s;
      }
      #settings-btn:hover {
        color: var(--text);
        background: var(--surface);
      }

      /* ── Status bar ── */
      #status-bar {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 10px 14px;
        font-size: 12px;
        color: var(--muted);
      }
      #status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        flex-shrink: 0;
        background: var(--muted);
      }
      #status-bar[data-state="checking"] #status-dot,
      #status-bar[data-state="bridge_down"] #status-dot { background: var(--yellow); }
      #status-bar[data-state="checking"],
      #status-bar[data-state="bridge_down"]             { color: var(--yellow); }
      #status-bar[data-state="ok"] #status-dot          { background: var(--green); }
      #status-bar[data-state="ok"]                      { color: var(--green); }
      #status-bar[data-state="auth_required"] #status-dot,
      #status-bar[data-state="server_down"]   #status-dot,
      #status-bar[data-state="error"]         #status-dot { background: var(--red); }
      #status-bar[data-state="auth_required"],
      #status-bar[data-state="server_down"],
      #status-bar[data-state="error"]         { color: var(--red); }

      /* ── Search ── */
      #search {
        padding: 10px 14px 14px;
        border-top: 1px solid var(--border);
      }
      #query {
        width: 100%;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 7px 9px;
        font: inherit;
        color: var(--text);
        outline: none;
      }
      #query:focus { border-color: var(--accent-bg); }
      #search-row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 8px;
      }
      #search-btn {
        background: var(--accent-bg);
        color: var(--accent-fg);
        border: none;
        border-radius: 6px;
        padding: 6px 14px;
        font: inherit;
        font-weight: 500;
        cursor: pointer;
      }
      #search-btn:disabled { opacity: 0.5; cursor: not-allowed; }
      #search-hint { font-size: 11px; color: var(--muted); }
      #results {
        margin-top: 10px;
        max-height: 320px;
        overflow-y: auto;
      }
      #results:empty { display: none; }
      #results.error {
        padding: 9px 11px;
        background: var(--surface);
        border-radius: 6px;
        font-size: 12.5px;
        color: var(--red);
      }
      .result {
        padding: 8px 10px;
        background: var(--surface);
        border-radius: 6px;
        margin-bottom: 6px;
        font-size: 12px;
        line-height: 1.45;
      }
      .result-meta {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        color: var(--muted);
        font-size: 11px;
        margin-bottom: 3px;
      }
      .result-app { font-weight: 500; color: var(--text); }
      .result-text {
        color: var(--text);
        word-break: break-word;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .result-type {
        display: inline-block;
        padding: 1px 5px;
        border-radius: 3px;
        background: var(--border);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        margin-right: 4px;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <span class="title">Thadm</span>
      <button id="settings-btn" title="Open settings">⚙</button>
    </div>

    <div id="status-bar" data-state="checking">
      <span id="status-dot"></span>
      <span id="status-text">checking…</span>
    </div>

    <div id="search">
      <input id="query" type="text" placeholder="Search thadm…" autofocus />
      <div id="search-row">
        <button id="search-btn">Search</button>
        <span id="search-hint">⌘+Enter to search</span>
      </div>
      <div id="results"></div>
    </div>

    <script src="popup.js" type="module"></script>
  </body>
</html>
